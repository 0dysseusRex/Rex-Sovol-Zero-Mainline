######### RexMacros #########

# ============================================================
# SECTION 1 — Nozzle / Toolhead Lighting
# ============================================================

[gcode_macro LIGHT_ON]
gcode:
    SET_PIN PIN=nozzle_light VALUE=1.0

[gcode_macro LIGHT_OFF]
gcode:
    SET_PIN PIN=nozzle_light VALUE=0.0

[gcode_macro LIGHT_BLINK]
variable_blinks: 3
variable_rate: 0.5
gcode:
    {% for i in range(blinks|int) %}
        SET_PIN PIN=nozzle_light VALUE=1.0
        G4 P{rate * 1000}
        SET_PIN PIN=nozzle_light VALUE=0.0
        G4 P{rate * 1000}
    {% endfor %}

[gcode_macro LIGHT_BREATHE]
variable_cycles: 3
variable_steps: 10
variable_rate: 50
gcode:
    {% for c in range(cycles|int) %}
        # Fade up
        {% for i in range(steps|int) %}
            SET_PIN PIN=nozzle_light VALUE={i / steps|float}
            G4 P{rate}
        {% endfor %}

        # Fade down
        {% for i in range(steps|int, -1, -1) %}
            SET_PIN PIN=nozzle_light VALUE={i / steps|float}
            G4 P{rate}
        {% endfor %}
    {% endfor %}


# ============================================================
# SECTION 2 — Toolhead / Maintenance Macros
# ============================================================

[gcode_macro FRONT_AND_CENTER]
gcode:

    LIGHT_BLINK BLINKS=1 RATE=0.05

    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    G0 Z100 F3000
    G0 X80 Y10 F6000

    RESPOND TYPE=command MSG="💂‍♂️ FRONT AND CENTER, SIR YES SIR! 🫡"
    LIGHT_BREATHE CYCLES=2


# ============================================================
# SECTION 3 — Chamber Heating + Exhaust Fan PID
# ============================================================

[gcode_macro START_CHAMBER_PREHEAT]
description: Preheat the chamber before printing high temp filaments
variable_chamber_target: 50

gcode:
    LIGHT_BREATHE
    {% set chamber_target = params.CHAMBER|default(chamber_target)|float %}

    # Home first
    G28

    # Start heating systems
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=120
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=80

    # Fans for chamber circulation
    SET_FAN_SPEED FAN=fan0 SPEED=0.5
    SET_FAN_SPEED FAN=fan2 SPEED=0.20

    # Move toolhead to airflow position
    G90
    G0 X-8 Y0

    # Wait for chamber to reach the target temperature
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={chamber_target}

    # Once chamber is ready, stop preheat
    STOP_CHAMBER_PREHEAT


[gcode_macro STOP_CHAMBER_PREHEAT]
description: Shut down chamber preheat systems
gcode:
    LIGHT_BLINK
    # Turn off heaters
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0

    # Turn off circulation fans
    SET_FAN_SPEED FAN=fan0 SPEED=0
    SET_FAN_SPEED FAN=fan2 SPEED=0
