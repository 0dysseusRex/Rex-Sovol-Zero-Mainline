#### crowsnest.conf — Sovol Zero / MGS1 USB chamber camera
#### Camera: HHW MGS1 (native MJPEG: 640x480, 800x480, 1280x720, etc.)
#### Do NOT use 720x540 — not a hardware mode; causes slow scaling (~1 fps).

[crowsnest]
log_path: /home/rex/printer_data/logs/crowsnest.log
log_level: verbose
delete_log: false
no_proxy: false

[cam 1]
mode: ustreamer
port: 8080
device: /dev/v4l/by-id/usb-HHW_microelectronics_Co.__Ltd._MGS1-video-index0
resolution: 640x480
max_fps: 15
# Native MJPEG + HW encoder; disable dynamic FPS throttling in dim chamber
custom_flags: --format=MJPEG --encoder=HW
# auto_exposure: 1=Manual, 3=Aperture Priority (camera default)
v4l2ctl: exposure_dynamic_framerate=0,auto_exposure=3,power_line_frequency=2,white_balance_automatic=1,brightness=0,contrast=32,saturation=64,sharpness=3
