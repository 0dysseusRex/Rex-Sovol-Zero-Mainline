#### crowsnest.conf — Sovol Zero / MGS1 USB chamber camera
#### Camera: HHW MGS1 (native MJPEG: 640x480, 800x480, 1280x720, etc.)
#### Do NOT use 720x540 — not a hardware mode; causes slow scaling (~1 fps).

[crowsnest]
log_path: /home/rex/printer_data/logs/crowsnest.log
log_level: verbose
delete_log: false
no_proxy: false

[cam 1]
mode: ustreamer
port: 8080
device: /dev/v4l/by-id/usb-HHW_microelectronics_Co.__Ltd._MGS1-video-index0
resolution: 800x480
max_fps: 15
# Native MJPEG + HW encoder; disable dynamic FPS throttling in dim chamber
# Manual exposure keeps FPS stable in the dark chamber (auto mode drops to ~1 fps)
# Auto white balance (with hue=0) is required for color accuracy: this sensor's
# manual temperature control cannot cancel the chamber-LED green axis.
v4l2ctl: auto_exposure=1,exposure_time_absolute=150,exposure_dynamic_framerate=0,gain=16,gamma=100,sharpness=4,backlight_compensation=0,white_balance_automatic=1,brightness=10,contrast=32,saturation=72,hue=0
