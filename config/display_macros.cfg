######################################################################
# Sovol Zero — UC1701 display menus
#
# Include after GP3D_Macro.cfg and Rex_Macros.cfg (needs their macros).
# SET_DISPLAY_TEXT is provided by Klipper [display_status] — do not redefine.
######################################################################


# -------------------------------------------------------------------
# Prepare → Calibration
# -------------------------------------------------------------------
[menu __main __prepare __calibration]
type: list
name: Calibration

[menu __main __prepare __calibration __clean]
type: command
name: Clean Nozzle
gcode:
    {menu.exit()}
    CLEAN_NOZZLE

[menu __main __prepare __calibration __loadcell_z]
type: command
name: Load Cell Z Touch
gcode:
    {menu.exit()}
    BED_LOADCELL_Z_OFFSET

[menu __main __prepare __calibration __probe_lc]
type: command
name: Test Load Cell
gcode:
    {menu.exit()}
    PROBE_LOAD_CELL

[menu __main __prepare __calibration __eddy_prep]
type: command
name: Eddy Cal Prep
gcode:
    {menu.exit()}
    EDDY_CALIBRATE_PREP

[menu __main __prepare __calibration __axis_twist]
type: command
name: Axis Twist Cal
gcode:
    {menu.exit()}
    AXIS_TWIST_COMPENSATION_CALIBRATE

[menu __main __prepare __chamber_preheat]
type: command
name: Chamber Preheat
gcode:
    {menu.exit()}
    START_CHAMBER_PREHEAT CHAMBER=50


# -------------------------------------------------------------------
# Tune — save load cell Z offset (extends GP3D "Save & Exit?" list)
# -------------------------------------------------------------------
[menu __main __tune __save __end_save]
type: command
name: End Print + Save Z
gcode:
    {menu.exit()}
    END_PRINT_G

[menu __main __tune __apply_z]
type: command
name: Save Z Offset Now
gcode:
    {menu.exit()}
    Z_OFFSET_APPLY_PROBE1
    SAVE_CONFIG


# -------------------------------------------------------------------
# Setup → Lights
# -------------------------------------------------------------------
[menu __main __setup __lights]
type: list
name: Lights

[menu __main __setup __lights __on]
type: command
name: Light On
gcode:
    {menu.exit()}
    LIGHT_ON

[menu __main __setup __lights __off]
type: command
name: Light Off
gcode:
    {menu.exit()}
    LIGHT_OFF

[menu __main __setup __lights __breathe]
type: command
name: Light Breathe
gcode:
    {menu.exit()}
    LIGHT_BREATHE
