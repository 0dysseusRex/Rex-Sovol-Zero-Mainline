[probe_eddy_current eddy]
sensor_type: ldc1612
descend_z: 0.5
#   The nominal distance (in mm) between the nozzle and bed that a
#   probing attempt should stop at. This parameter must be provided.
i2c_mcu: extruder_mcu
i2c_software_scl_pin: extruder_mcu:PB10
i2c_software_sda_pin: extruder_mcu:PB11
x_offset: -19.8
y_offset: -0.75
#   See the "probe" section for information on these parameters.
#tap_threshold: 12010 # used value from line z: 2.010 # noise 0.001004mm, MAD_Hz=20.953 * 2
#   Noise cutoff/stop trigger threshold delta Hz per sample
#   See the Eddy_Probe.md for explanation
# reg_drive_current: 16  # managed by SAVE_CONFIG after LDC_CALIBRATE_DRIVE_CURRENT
max_sensor_hz: 5930000

#[z_offset_calibration]
#non_contact_probe: probe_eddy_current eddy
#contact_probe: probe_eddy_current eddy
#endstop_xy_position: 76.2,76.2
#z_hop: 2
#z_hop_speed: 5
#internal_endstop_offset: -0.15

[bed_mesh]
# rapid_scan with reduced grid/speed; hotend off + camera pause in PRINT_START
speed: 150
horizontal_move_z: 2.0
algorithm: bicubic
bicubic_tension: 0.5
split_delta_z: 0.0125 # see: https://www.klipper3d.org/Bed_Mesh.html#move-splitting
mesh_pps: 3,3
mesh_min: 12,12            
mesh_max: 132,140 
probe_count: 15,15
fade_start: 1
fade_end: 10
fade_target: 0
scan_overshoot: 2
adaptive_margin: 3
zero_reference_position: 77.50, 76.25

[gcode_macro BED_MESH_CALIBRATE]
description: Bed mesh via eddy rapid_scan (non-contact)
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    {% set scv = printer.toolhead.square_corner_velocity|float %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1.0
    {% if params.METHOD is defined %}
        BED_MESH_CALIBRATE_BASE {rawparams}
    {% else %}
        BED_MESH_CALIBRATE_BASE METHOD=rapid_scan {rawparams}
    {% endif %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={scv}

[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
gcode:
  {% set Z = printer.toolhead.position.z %}
  SET_KINEMATIC_POSITION Z={Z - printer.probe.last_probe_position.z}

[gcode_macro SET_Z_FROM_PROBE]
gcode:
    {% set METHOD = params.METHOD | default("automatic") %}
    {% set SAMPLES = params.SAMPLES | default(5) %}
    {% set PROBE_SPEED = params.PROBE_SPEED | default(5) %}
    {% set LIFT_SPEED = params.LIFT_SPEED | default(5) %}
    {% set SAMPLE_RETRACT_DIST = params.SAMPLE_RETRACT_DIST | default(2) %}
    {% set SAMPLES_TOLERANCE_RETRIES = params.SAMPLES_TOLERANCE_RETRIES | default(3) %}
    {% set SAMPLES_TOLERANCE = params.SAMPLES_TOLERANCE | default(0.025) %}
    {% set SAMPLES_RESULT = params.SAMPLES_RESULT | default("average") %}
    PROBE METHOD={METHOD} SAMPLES={SAMPLES} PROBE_SPEED={PROBE_SPEED} LIFT_SPEED={LIFT_SPEED} SAMPLE_RETRACT_DIST={SAMPLE_RETRACT_DIST} SAMPLES_TOLERANCE_RETRIES={SAMPLES_TOLERANCE_RETRIES} SAMPLES_TOLERANCE={SAMPLES_TOLERANCE} SAMPLES_RESULT={SAMPLES_RESULT}
    _RELOAD_Z_OFFSET_FROM_PROBE
    G0 Z5

[gcode_macro _ADJ_SCAN_FROM_TAP]
gcode:
    {% set OFFSET = printer.probe.last_probe_position.z %}
    SET_GCODE_OFFSET Z={(-OFFSET)}



[gcode_macro EDDY_CALIBRATE_PREP]
description: Bootstrap Z homing for first-time eddy cal (load cell touch at X25 Y20)
gcode:
    {% set lc_x = params.X|default(25)|float %}
    {% set lc_y = params.Y|default(20)|float %}
    {% set sync_z = params.SYNC_Z|default(25)|float %}
    G28 X Y
    G90
    G0 X{lc_x} Y{lc_y} F6000
    # SYNC_Z sets virtual Z reference. With position_min ~-5, probe reach is roughly
    # (starting_height_above_bed - SYNC_Z - 5) mm. SYNC_Z=25 allows ~30 mm starting gap.
    SET_KINEMATIC_POSITION Z={sync_z}
    G0 Z{sync_z + 5} F600
    G0 Z{sync_z - 5} F300
    GET_PRESSURE_TARE
    RUN_PROBE_PRESSURE
    {% set touch = printer.probe_pressure.last_z_result|float %}
    {% if touch > 1.0 %}
        {action_raise_error("Load cell did not touch bed (Z=%.3f). Nozzle may still be too high — lower it closer to the bed and retry, or increase SYNC_Z." % (touch,))}
    {% endif %}
    SET_KINEMATIC_POSITION Z={touch}
    G0 Z5 F300
    RESPOND PREFIX="eddy" MSG="Z synced at X{lc_x} Y{lc_y} (touch {touch|round(4)}). Run LDC_CALIBRATE_DRIVE_CURRENT CHIP=eddy then EDDY_CALIBRATE_LOADCELL"

# Experimental: eddy height cal from load cell touches (no paper test).
# Requires klippy/extras/eddy_loadcell_calibrate.py (install-probe-pressure.sh).
[eddy_loadcell_calibrate]
chip: eddy
loadcell_x: 25
loadcell_y: 20
bed_temp: 80
nozzle_temp: 150
loadcell_samples: 5
loadcell_tolerance: 0.050
probe_speed: 5
lift_z: 5

[gcode_macro EDDY_CALIBRATE_LOADCELL]
description: Experimental eddy cal via load cell (after EDDY_CALIBRATE_PREP + drive current)
gcode:
    PROBE_EDDY_CURRENT_CALIBRATE_LOADCELL {rawparams}

[gcode_macro SET_SCAN_FROM_TAP]
gcode:
    {% set SAMPLES = params.SAMPLES | default(5) %}
    {% set PROBE_SPEED = params.PROBE_SPEED | default(3) %}
    {% set LIFT_SPEED = params.LIFT_SPEED | default(3) %}
    {% set SAMPLES_TOLERANCE_RETRIES = params.SAMPLES_TOLERANCE_RETRIES | default(3) %}
    {% set SAMPLES_TOLERANCE = params.SAMPLES_TOLERANCE | default(0.025) %}
    {% set SAMPLES_RESULT = params.SAMPLES_RESULT | default("average") %}

    SET_Z_FROM_PROBE METHOD=tap
    # Move to the tap point
    {% set is_absolute = printer.gcode_move.absolute_coordinates %}
    G90
    {% set cf = printer.configfile.settings %}
    {% set eddy = cf["probe_eddy_current eddy"] %}
    {% set amap = printer.gcode_move.axis_map %}
    {% set tpos = printer.gcode_move.position %}
    G0 Z5 F300 # Z-Hop
    G0 Y{tpos[amap["Y"]] - eddy.y_offset} X{tpos[amap["X"]] - eddy.x_offset} F3000
    G0 Z{eddy.descend_z} F300
    PROBE METHOD=scan SAMPLES={SAMPLES} PROBE_SPEED={PROBE_SPEED} LIFT_SPEED={LIFT_SPEED} SAMPLES_TOLERANCE_RETRIES={SAMPLES_TOLERANCE_RETRIES} SAMPLES_TOLERANCE={SAMPLES_TOLERANCE} SAMPLES_RESULT={SAMPLES_RESULT}
    _ADJ_SCAN_FROM_TAP
    {% if not is_absolute %}
    G91
    {% endif %}