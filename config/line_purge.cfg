# Adaptive line purge (SimpleAF-style simplified KAMP)
# Based on pellcorp/creality _LINE_PURGE + kyleisah/KAMP
#
# Requires Moonraker object preprocessing in the slicer start gcode:
#   M117
#   PRINT_START ...
# Enable adaptive placement when the slicer emits EXCLUDE_OBJECT commands.

[exclude_object]

[gcode_macro _KAMP_Settings]
description: Line purge tuning (SimpleAF-style)
variable_purge_height: 0.5
variable_tip_distance: 7.0
variable_purge_margin: 15
variable_purge_amount: 48
variable_flow_rate: 12
variable_line_purge_z_hop: 2
variable_line_purge_retract: 0.5
variable_line_purge_retract_speed: 35.0
# Fixed purge corner when no EXCLUDE_OBJECT data is available
variable_fallback_x: 15
variable_fallback_y: 15
gcode:

[gcode_macro SETUP_LINE_PURGE]
description: Tune line purge settings at runtime
gcode:
    {% set s = printer["gcode_macro _KAMP_Settings"] %}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=purge_height VALUE={params.PURGE_HEIGHT|default(s.purge_height)|float}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=tip_distance VALUE={params.TIP_DISTANCE|default(s.tip_distance)|float}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=purge_margin VALUE={params.PURGE_MARGIN|default(s.purge_margin)|float}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=purge_amount VALUE={params.PURGE_AMOUNT|default(s.purge_amount)|float}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=flow_rate VALUE={params.FLOW_RATE|default(s.flow_rate)|float}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=line_purge_z_hop VALUE={params.Z_HOP|default(s.line_purge_z_hop)|float}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=fallback_x VALUE={params.FALLBACK_X|default(s.fallback_x)|float}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=fallback_y VALUE={params.FALLBACK_Y|default(s.fallback_y)|float}
    RESPOND MSG="Line purge settings updated"

[gcode_macro LINE_PURGE]
description: Adaptive line purge near the print (SimpleAF-style KAMP)
gcode:
    {% if params.PURGE|default(1)|int == 0 %}
        RESPOND MSG="LINE_PURGE skipped"
    {% else %}
        _LINE_PURGE {rawparams}
    {% endif %}

[gcode_macro _LINE_PURGE]
description: Internal adaptive line purge
gcode:
    {% set cfg = printer["gcode_macro _KAMP_Settings"] %}
    {% set travel_speed = (printer.toolhead.max_velocity * 30) | float %}
    {% set z_height = cfg.line_purge_z_hop | float %}
    {% set purge_height = cfg.purge_height | float %}
    {% set tip_distance = cfg.tip_distance | float %}
    {% set purge_margin = cfg.purge_margin | float %}
    {% set purge_amount = cfg.purge_amount | float %}
    {% set retract_amount = cfg.line_purge_retract | float %}
    {% set retract_speed = (cfg.line_purge_retract_speed * 60) | float %}
    {% set flow_rate = cfg.flow_rate | float %}
    {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}
    {% set min_extrude_temp = printer.configfile.settings.extruder.min_extrude_temp | float %}

    {% if printer.extruder.temperature < min_extrude_temp %}
        {action_respond_info("LINE_PURGE skipped: extruder below min_extrude_temp")}
    {% else %}
        {% set objects = printer.exclude_object.objects | default([]) %}
        {% if objects | length > 0 %}
            {% set all_points = objects | map(attribute='polygon') | sum(start=[]) %}
            {% set purge_x_min = (all_points | map(attribute=0) | min) %}
            {% set purge_x_max = (all_points | map(attribute=0) | max) %}
            {% set purge_y_min = (all_points | map(attribute=1) | min) %}
            {% set purge_y_max = (all_points | map(attribute=1) | max) %}
            {% set purge_x_center = ([((purge_x_max + purge_x_min) / 2) - (purge_amount / 2), 0] | max) %}
            {% set purge_y_center = ([((purge_y_max + purge_y_min) / 2) - (purge_amount / 2), 0] | max) %}
            {% set purge_x_origin = ([purge_x_min - purge_margin, 0] | max) %}
            {% set purge_y_origin = ([purge_y_min - purge_margin, 0] | max) %}
            {% set adaptive = True %}
        {% else %}
            {% set purge_x_center = cfg.fallback_x | float %}
            {% set purge_y_center = cfg.fallback_y | float %}
            {% set purge_x_origin = cfg.fallback_x | float %}
            {% set purge_y_origin = cfg.fallback_y | float %}
            {% set adaptive = False %}
        {% endif %}

        {% if adaptive %}
            {% if purge_y_origin > 0 %}
                {action_respond_info("LINE_PURGE at X%.1f Y%.1f (adaptive, %.0fmm)" % (purge_x_center, purge_y_origin, purge_amount))}
            {% else %}
                {action_respond_info("LINE_PURGE at X%.1f Y%.1f (adaptive, %.0fmm)" % (purge_x_origin, purge_y_center, purge_amount))}
            {% endif %}
        {% else %}
            {action_respond_info("LINE_PURGE at X%.1f Y%.1f (fixed fallback, %.0fmm)" % (purge_x_center, purge_y_origin, purge_amount))}
        {% endif %}

        SAVE_GCODE_STATE NAME=line_purge_state
        G92 E0
        G0 F{travel_speed}
        G90
        M83

        {% if adaptive and purge_y_origin > 0 %}
            G0 X{purge_x_center} Y{purge_y_origin}
            G0 Z{purge_height}
            G1 E{tip_distance} F{purge_move_speed}
            G1 X{purge_x_center + purge_amount} E{purge_amount} F{purge_move_speed}
            G1 E-{retract_amount} F{retract_speed}
            G0 X{purge_x_center + purge_amount + 10} F{travel_speed}
        {% elif adaptive %}
            G0 X{purge_x_origin} Y{purge_y_center}
            G0 Z{purge_height}
            G1 E{tip_distance} F{purge_move_speed}
            G1 Y{purge_y_center + purge_amount} E{purge_amount} F{purge_move_speed}
            G1 E-{retract_amount} F{retract_speed}
            G0 Y{purge_y_center + purge_amount + 10} F{travel_speed}
        {% else %}
            G0 X{purge_x_center} Y{purge_y_origin}
            G0 Z{purge_height}
            G1 E{tip_distance} F{purge_move_speed}
            G1 X{purge_x_center + purge_amount} E{purge_amount} F{purge_move_speed}
            G1 E-{retract_amount} F{retract_speed}
            G0 X{purge_x_center + purge_amount + 10} F{travel_speed}
        {% endif %}

        G92 E0
        M82
        G0 Z{z_height} F{travel_speed}
        RESTORE_GCODE_STATE NAME=line_purge_state MOVE=0
    {% endif %}
