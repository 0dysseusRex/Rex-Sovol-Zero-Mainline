# -------------------------------------------------------------------
# Print start — eddy + load cell + mesh flow
# Merge into your PRINT_START or include as-is and remove duplicate.
# -------------------------------------------------------------------
[gcode_macro START_PRINT]
description: Sovol slicer alias for PRINT_START
gcode:
    PRINT_START {rawparams}

[gcode_macro PRINT_START]
description: Start print (load cell Z offset + eddy mesh)
gcode:
    {% set bed = params.BED|default(0)|float %}
    {% set hotend = params.HOTEND|default(0)|float %}
    {% set chamber = params.CHAMBER|default(0)|float %}

    # --- Eddy homing first (non-contact Z — same as Cartographer G28 before TOUCH_HOME) ---
    G28 X Y
    G28 Z

    # --- Bed heat (eddy accuracy improves with stable bed temp) ---
    {% if bed > 0 %}
        M140 S{bed}
        M190 S{bed}
    {% endif %}

    # --- Optional chamber heat — remove if you have no chamber macros ---
    # {% if chamber > 0 %}
    #     M141 S{chamber}
    #     M191 S{chamber}
    # {% endif %}

    # --- OEM silicone nozzle wipe (before probing); optional brass brush: CLEAN_NOZZLE_BRASS ---
    CLEAN_NOZZLE

    # --- Heat nozzle to probing temp before load cell touch ---
    M104 S150
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=150

    # --- Fine Z0: load cell nozzle touch (Cartographer-style — only here, not in G28) ---
    SET_GCODE_OFFSET Z=0
    BED_LOADCELL_Z_OFFSET
    G28 Z

    # --- Final hotend temp ---
    {% if hotend > 0 %}
        M104 S{hotend}
        M109 S{hotend}
    {% endif %}

    # --- Eddy bed mesh ---
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

    # --- Optional skew profile — replace name or remove ---
    # SKEW_PROFILE LOAD=your_profile_name

    # --- Optional line purge — uncomment when [include line_purge.cfg] is active ---
    # LINE_PURGE


# -------------------------------------------------------------------
# PAUSE / CANCEL_PRINT / END_PRINT — see pause_cancel_macros.cfg
# Do NOT define those three macros here; include pause_cancel_macros.cfg
# after Macro.cfg in printer.cfg.
# -------------------------------------------------------------------
