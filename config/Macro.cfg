######################################################################
# Sovol Zero — mainline Klipper MACRO MERGE TEMPLATE
#
# NOT a drop-in Macro.cfg. Merge these macros into YOUR existing macro
# file (or include this file after your other macro includes).
#
# Required: G28, PRINT_START (+ START_PRINT alias), END_PRINT
# Optional: customize park positions, chamber heat, skew, LINE_PURGE
# See docs/INSTALL.md
######################################################################


# -------------------------------------------------------------------
# G28 — block Z home until eddy is calibrated (mainline has no is_calibrated)
# Replace your G28 macro or merge this rename_existing pattern.
# -------------------------------------------------------------------
[gcode_macro G28]
rename_existing: M9928
gcode:
    {% set eddy = printer.configfile.settings['probe_eddy_current eddy'] %}
    {% set want_z = params.Z is defined or (params.X is not defined and params.Y is not defined) %}
    {% if want_z and 'calibrate' not in eddy %}
        {% if params.X is defined or params.Y is defined %}
            M9928 {rawparams}
        {% else %}
            M9928 X
            M9928 Y
            RESPOND PREFIX="zoffset" MSG="Eddy not calibrated — XY only. Run PROBE_EDDY_CURRENT_CALIBRATE CHIP=eddy then SAVE_CONFIG"
            M400
        {% endif %}
    {% else %}
        M9928 {rawparams}
    {% endif %}


# -------------------------------------------------------------------
# Nozzle clean — OEM brush + silicone wipe (requires LIGHT_BLINK macro)
# Merge from your existing Macro.cfg or keep if already present.
# -------------------------------------------------------------------
[gcode_macro CLEAN_NOZZLE]
description: Brass brush + active cooldown + OEM silicone wipe
gcode:
    G90
    {% if not printer.toolhead.homed_axes %}
        G28
    {% endif %}
    BED_MESH_CLEAR
    M104 S250
    M109 S250
    G0 Z10 F6000
    G0 X-10 Y98 F6000
    G0 Z1 F3000
    M104 S160
    M106 S255
    G0 X-10 Y60 F3000
    G0 X-10 Y85 F3000
    G0 X-10 Y50 F3000
    G0 X-10 Y95 F3000
    G0 X-10 Y60 F3000
    G0 X-10 Y85 F3000
    G0 X-10 Y60 F200
    G0 X-10 Y85 F200
    G0 Z10 F3000
    M104 S130
    M109 S130
    M106 S0
    G0 X-9.2 Y10 F6000
    G0 Z-1 F3000
    G1 Y45 F1400
    G1 X-8.2 Y10
    G1 Y45
    G1 X-8.2 Y10
    G1 Y38
    G1 X-9.2 Y12
    G1 Y38
    G1 X-9.2 Y12
    G1 Y33
    G1 X-8.2 Y14
    G1 Y33
    G1 X-8.2 Y14
    G1 Y28 F400
    G1 X-9.2 Y16
    G1 Y28
    G1 X-9.2 Y16
    G1 Z5 F3000
    G0 X100 Y100 F6000
    RESPOND PREFIX="clean" MSG="Nozzle cleaning complete."


# -------------------------------------------------------------------
# Print start — eddy + load cell + mesh flow
# Merge into your PRINT_START or include as-is and remove duplicate.
# -------------------------------------------------------------------
[gcode_macro START_PRINT]
description: Sovol slicer alias for PRINT_START
gcode:
    PRINT_START {rawparams}

[gcode_macro PRINT_START]
description: Start print (load cell Z offset + eddy mesh)
gcode:
    {% set bed = params.BED|default(0)|float %}
    {% set hotend = params.HOTEND|default(0)|float %}
    {% set chamber = params.CHAMBER|default(0)|float %}

    # --- Home if needed ---
    {% if not printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # --- Bed heat (eddy accuracy improves with stable bed temp) ---
    {% if bed > 0 %}
        M140 S{bed}
        M190 S{bed}
    {% endif %}

    # --- Optional chamber heat — remove if you have no chamber macros ---
    # {% if chamber > 0 %}
    #     M141 S{chamber}
    #     M191 S{chamber}
    # {% endif %}

    # --- Nozzle brush + silicone wipe (before probing) ---
    CLEAN_NOZZLE

    # --- Heat nozzle to probing temp before load cell touch ---
    M104 S150
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=150

    # --- Z offset: reset → load cell fine touch → re-home Z ---
    SET_GCODE_OFFSET Z=0
    BED_LOADCELL_Z_OFFSET
    G28 Z

    # --- Final hotend temp ---
    {% if hotend > 0 %}
        M104 S{hotend}
        M109 S{hotend}
    {% endif %}

    # --- Eddy bed mesh ---
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

    # --- Optional skew profile — replace name or remove ---
    # SKEW_PROFILE LOAD=your_profile_name

    # --- Optional line purge — uncomment when [include line_purge.cfg] is active ---
    # LINE_PURGE


# -------------------------------------------------------------------
# Print end — minimal; merge park/cooldown/fans from your own macros
# -------------------------------------------------------------------
[gcode_macro END_PRINT]
description: End print (minimal — customize park and cooldown)
gcode:
    {% set z_max = printer.configfile.settings['stepper_z'].position_max|float %}
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}

    M117 Print finished
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
        G91
        {% if printer.extruder.temperature >= e_mintemp %}
            G1 E-2 F2700
            G1 Z0.2 F2400
        {% endif %}
        {% if (printer.gcode_move.position.z + 10) < z_max %}
            G1 Z10 F3000
        {% else %}
            G1 Z{(z_max - printer.gcode_move.position.z)} F3000
        {% endif %}
        G90
        # --- Park — replace with your preferred position ---
        G1 X115 Y152.5 F9000
    {% endif %}

    TURN_OFF_HEATERS
    M84 X Y Z E
