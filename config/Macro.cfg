######### Macro.cfg #########


# ============================================================
# SECTION 2 — Nozzle Cleaning / Maintenance
# ============================================================

[gcode_macro CLEAN_NOZZLE]
description: Brass brush + active cooldown + OEM silicone wipe
gcode:
    LIGHT_BLINK BLINKS=2 RATE=0.25

    G90
    {% if not printer.toolhead.homed_axes %}
        G28
    {% endif %}

    BED_MESH_CLEAR

    # -------------------------------
    # Stage 1: HEAT TO 250C
    # -------------------------------
    M104 S250
    M109 S250

    # Move above brush start
    G0 Z10 F6000
    G0 X-10 Y98 F6000
    G0 Z1 F3000

    # -------------------------------
    # Begin cooldown to 160C WHILE brushing
    # -------------------------------
    M104 S160
    M106 S255   ; part cooling fan ON full blast

    # Normal-speed brushing passes (Y60 <-> Y85)
    G0 X-10 Y60 F3000
    G0 X-10 Y85 F3000

    G0 X-10 Y50 F3000
    G0 X-10 Y95 F3000

    G0 X-10 Y60 F3000
    G0 X-10 Y85 F3000

    G0 X-10 Y50 F3000
    G0 X-10 Y95 F3000

    G0 X-10 Y60 F3000
    G0 X-10 Y85 F3000


    # -------------------------------
    # Final slow pass to allow cooldown to finish
    # -------------------------------
    G0 X-10 Y60 F200
    G0 X-10 Y85 F200
    
    G0 X-10 Y60 F200
    G0 X-10 Y85 F200

    G0 X-10 Y60 F40
    G0 X-10 Y85 F40

    # Lift off brush
    G0 Z10 F3000

    # -------------------------------
    # Stage 2: COOL TO 130C FOR SILICONE WIPE
    # -------------------------------
    M104 S130
    M109 S130

    # Fan OFF before silicone wipe
    M106 S0

    # Move to silicone pad start
    G0 X-9.2 Y10 F6000
    G0 Z-1 F3000

    # OEM-style silicone wipe pattern
    G1 Y45 F1400
    G1 X-8.2 Y10
    G1 Y45
    G1 X-8.2 Y10

    G1 Y38
    G1 X-9.2 Y12
    G1 Y38
    G1 X-9.2 Y12

    G1 Y33
    G1 X-8.2 Y14
    G1 Y33
    G1 X-8.2 Y14

    G1 Y28 F400
    G1 X-9.2 Y16
    G1 Y28
    G1 X-9.2 Y16

    # Lift and park
    G1 Z5 F3000
    G0 X100 Y100 F6000

    LIGHT_BLINK BLINKS=3 RATE=0.15
    RESPOND PREFIX="clean" MSG="Nozzle cleaning complete."



