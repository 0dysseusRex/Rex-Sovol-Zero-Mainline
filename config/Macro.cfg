######################################################################
# Sovol Zero  -  mainline Klipper MACRO MERGE TEMPLATE
#
# NOT a drop-in Macro.cfg. Merge these macros into YOUR existing macro
# file (or include this file after your other macro includes).
#
# Required: G28, PRINT_START (+ START_PRINT alias), END_PRINT
# Optional: customize park positions, chamber heat, skew, LINE_PURGE
# See docs/INSTALL.md
######################################################################


# -------------------------------------------------------------------
# Shared variables for PAUSE / CANCEL_PRINT / END_PRINT (pause_cancel_macros.cfg)
# -------------------------------------------------------------------
[gcode_macro _global_var]
variable_pause_park: {'x': -2, 'y': -1, 'z': 10, 'e': 1}
variable_cancel_park: {'x': 0, 'y': 152.5, 'z': 10, 'e': 1}
variable_z_maximum_lifting_distance: 153
variable_pause_resume_travel_speed: 150
variable_load_filament_extruder_temp: 250
variable_has_z_offset_calibrated: False
variable_filament_sensor_print: False
gcode:


[gcode_macro ALL_FAN_OFF]
gcode:
    SET_FAN_SPEED FAN=fan0 SPEED=0
    SET_FAN_SPEED FAN=fan2 SPEED=0


# -------------------------------------------------------------------
# G28  -  Z homes via eddy probe ONLY (probe:z_virtual_endstop on [stepper_z]).
# The bed load cell / nozzle never participates in homing.
# Load cell touch runs only in BED_LOADCELL_Z_OFFSET (PRINT_START) and cal macros.
# Blocks full Z home until eddy calibrate data exists in SAVE_CONFIG.
# -------------------------------------------------------------------
[gcode_macro G28]
description: Home axes  -  Z via eddy probe, never load cell
rename_existing: M9928
gcode:
    {% set eddy = printer.configfile.settings['probe_eddy_current eddy'] %}
    {% set want_z = params.Z is defined or (params.X is not defined and params.Y is not defined) %}
    {% if want_z and 'calibrate' not in eddy %}
        {% if params.X is defined or params.Y is defined %}
            M9928 {rawparams}
        {% else %}
            M9928 X
            M9928 Y
            RESPOND PREFIX="zoffset" MSG="Eddy not calibrated  -  XY only. Run PROBE_EDDY_CURRENT_CALIBRATE CHIP=eddy then SAVE_CONFIG"
            M400
        {% endif %}
    {% else %}
        M9928 {rawparams}
    {% endif %}


# -------------------------------------------------------------------
# Nozzle clean  -  brass brush + OEM silicone wiper (Rex live config)
#
# Restored from Macro.cfg.bak-rapidscan-camera. Stock OEM-only silicone
# variant is commented below as CLEAN_NOZZLE_OEM.
# -------------------------------------------------------------------
[gcode_macro CLEAN_NOZZLE]
description: Brass brush + active cooldown + OEM silicone wipe
gcode:
    LIGHT_BLINK BLINKS=2 RATE=0.25

    G90
    {% if not printer.toolhead.homed_axes %}
        G28
    {% endif %}

    BED_MESH_CLEAR

    # Stage 1: heat to 250°C, brush while cooling to 160°C
    M104 S250
    M109 S250

    G0 Z10 F6000
    G0 X-9.5 Y98 F6000
    G0 Z1 F3000

    M104 S160
    SET_FAN_SPEED FAN=fan0 SPEED=1.0

    G0 X-9.5 Y60 F3000
    G0 X-9.5 Y85 F3000
    G0 X-9.5 Y50 F3000
    G0 X-9.5 Y95 F3000
    G0 X-9.5 Y60 F3000
    G0 X-9.5 Y85 F3000
    G0 X-9.5 Y50 F3000
    G0 X-9.5 Y95 F3000
    G0 X-9.5 Y60 F3000
    G0 X-9.5 Y85 F3000

    G0 X-9.5 Y60 F200
    G0 X-9.5 Y85 F200
    G0 X-9.5 Y60 F200
    G0 X-9.5 Y85 F200
    G0 X-9.5 Y60 F40
    G0 X-9.5 Y85 F40

    # Stay on brush at Z1 until 160C before moving to silicone
    M109 S160

    # Stage 2: cool to 130°C, silicone wipe
    M104 S130
    M109 S130
    SET_FAN_SPEED FAN=fan0 SPEED=0

    G0 X-9.2 Y10 F6000
    G0 Z-1 F3000

    G1 Y45 F1400
    G1 X-8.2 Y10
    G1 Y45
    G1 X-8.2 Y10
    G1 Y38
    G1 X-9.2 Y12
    G1 Y38
    G1 X-9.2 Y12
    G1 Y33
    G1 X-8.2 Y14
    G1 Y33
    G1 X-8.2 Y14
    G1 Y28 F400
    G1 X-9.2 Y16
    G1 Y28
    G1 X-9.2 Y16

    # OEM-style bed touch: hold on load cell area while cooling to 100C
    NOZZLE_BED_COOLDOWN TEMP=100

    G1 Z5 F3000
    G0 X100 Y100 F6000

    LIGHT_BLINK BLINKS=3 RATE=0.15
    RESPOND PREFIX="clean" MSG="Nozzle cleaning complete."

