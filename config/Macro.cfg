######################################################################
# Sovol Zero — mainline Klipper MACRO MERGE TEMPLATE
#
# NOT a drop-in Macro.cfg. Merge these macros into YOUR existing macro
# file (or include this file after your other macro includes).
#
# Required: G28, PRINT_START (+ START_PRINT alias), END_PRINT
# Optional: customize park positions, chamber heat, skew, LINE_PURGE
# See docs/INSTALL.md
######################################################################


# -------------------------------------------------------------------
# G28 — Z homes via eddy probe ONLY (probe:z_virtual_endstop on [stepper_z]).
# The bed load cell / nozzle never participates in homing.
# Load cell touch runs only in BED_LOADCELL_Z_OFFSET (PRINT_START) and cal macros.
# Blocks full Z home until eddy calibrate data exists in SAVE_CONFIG.
# -------------------------------------------------------------------
[gcode_macro G28]
description: Home axes — Z via eddy probe, never load cell
rename_existing: M9928
gcode:
    {% set eddy = printer.configfile.settings['probe_eddy_current eddy'] %}
    {% set want_z = params.Z is defined or (params.X is not defined and params.Y is not defined) %}
    {% if want_z and 'calibrate' not in eddy %}
        {% if params.X is defined or params.Y is defined %}
            M9928 {rawparams}
        {% else %}
            M9928 X
            M9928 Y
            RESPOND PREFIX="zoffset" MSG="Eddy not calibrated — XY only. Run PROBE_EDDY_CURRENT_CALIBRATE CHIP=eddy then SAVE_CONFIG"
            M400
        {% endif %}
    {% else %}
        M9928 {rawparams}
    {% endif %}


# -------------------------------------------------------------------
# Nozzle clean — stock Sovol silicone wiper (default)
#
# Adapted from Sovol OEM Macro.cfg for mainline Klipper:
# https://github.com/Sovol3d/SOVOL-ZERO/blob/main/sovol/printer_data/config/Macro.cfg
#
# OEM uses RUN_PROBE_VIR_CONTACT (vendor probe_eddy_current command) — omitted here;
# fine Z is handled by BED_LOADCELL_Z_OFFSET in PRINT_START instead.
#
# Optional brass wire brush mod — see CLEAN_NOZZLE_BRASS below and README.
# -------------------------------------------------------------------
[gcode_macro CLEAN_NOZZLE]
description: OEM Sovol silicone wiper (200 C wipe, cool to 130 C)
gcode:
    BED_MESH_CLEAR
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    M109 S200
    G90
    G1 X30 Y30 F9000
    G4 P100
    M400
    ; RUN_PROBE_VIR_CONTACT  ; Sovol vendor only — not on mainline Klipper
    G91
    G1 Z2
    G90
    G1 X-9.2 Y0
    G91
    G1 Z-2.4
    G90
    G1 Y45 F2400
    G1 X-8.2 Y10
    G1 Y45
    G1 X-8.2 Y10
    G1 Y38
    G1 X-9.2 Y12
    G1 Y38
    G1 X-9.2 Y12
    G1 Y33
    G1 X-8.2 Y14
    G1 Y33
    G1 X-8.2 Y14
    G1 Y28
    G1 X-9.2 Y16
    G1 Y28
    G1 X-9.2 Y16
    G1 Z3
    G1 X30 Y30 F9000
    G4 P300
    M400
    ; RUN_PROBE_VIR_CONTACT  ; Sovol vendor only
    M106 S255
    M109 S130
    M106 S0
    G1 Z5
    RESPOND PREFIX="clean" MSG="Nozzle cleaning complete."

