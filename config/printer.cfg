# ============================================================
#   SOVOL ZERO — MAINLINE KLIPPER CONFIG (Eddy + EddyNG TAP)
#   Fully merged from your existing system
#   Preserves: RexMacros, Chamber PID, Exhaust Fan, LEDs,
#              PLR, GP3D, ShakeTune, Timelapse, Calilantern,
#              Nozzle Clean, custom START/END/CANCEL logic.
# ============================================================

# -------------------------
#  Include Structure
# -------------------------
[include mainsail.cfg]
[include timelapse.cfg]
[include Macro.cfg]
[include GP3D_Macro.cfg]
[include shaketune.cfg]
[include Rex_Macros.cfg]
#[include eddyng.cfg]
[include sovol_eddy.cfg]
[include probe_pressure.cfg]


# -------------------------
#  MCU Definitions
# -------------------------
[mcu]
canbus_uuid: 570424c137dd

[mcu extruder_mcu]
canbus_uuid: c3fae49bb209

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PA8,   EXP1_2=PC9,
    EXP1_3=PA10,  EXP1_4=PA9,
    EXP1_5=PC11,  EXP1_6=PC10,
    EXP1_7=PD8,   EXP1_8=PC12,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PB14,  EXP2_2=PB13,
    EXP2_3=PC7,   EXP2_4=PB12,
    EXP2_5=PC6,   EXP2_6=PB15,
    EXP2_7=PC8,   EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

# -------------------------
#  Accelerometer (Toolhead)
# -------------------------
[lis2dw]
cs_pin: extruder_mcu:PB12
spi_software_sclk_pin: extruder_mcu:PB13
spi_software_mosi_pin: extruder_mcu:PB15
spi_software_miso_pin: extruder_mcu:PB14
axes_map: -x,-z,-y

# -------------------------
#  Printer Kinematics
# -------------------------
[printer]
kinematics: corexy
max_velocity: 1200
max_accel: 6500
minimum_cruise_ratio: 0.5
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 5.0

# -------------------------
#  Input Shaper
# -------------------------
[input_shaper]
damping_ratio_x: 0.001
damping_ratio_y: 0.001

# -------------------------
#  Eddy Probe (Mesh)
# -------------------------

#[probe_eddy_current eddy]
#sensor_type: ldc1612
#i2c_mcu: extruder_mcu
#i2c_bus: i2c2
#x_offset: -19.8
#y_offset: -0.75
# Z offset is generated ONLY by PROBE_EDDY_CURRENT_CALIBRATE
# Do NOT manually set z_offset here
# Klipper will populate it in SAVE_CONFIG
#reg_drive_current: 16
#max_sensor_hz: 5886574

# -------------------------
#  EddyNG TAP (Contact)
# -------------------------

#[z_offset_calibration]
#non_contact_probe: probe_eddy_current eddy
#contact_probe: probe_eddy_current eddy
#endstop_xy_position: 76.2,76.2
#z_hop: 2
#z_hop_speed: 5
#internal_endstop_offset: -0.15


# -------------------------
#  Safe Z Home
# -------------------------
[safe_z_home]
home_xy_position: 76.2,76.2
speed: 90.0
z_hop: 5
z_hop_speed: 10.0

# -------------------------
#  Bed Mesh
# -------------------------
#[bed_mesh]
#speed: 300
#horizontal_move_z: 2.0
#algorithm: bicubic
#mesh_min: 12,12
#mesh_max: 132,140
#probe_count: 30,30
#fade_start: 0
#fade_end: 20
#scan_overshoot: 3

# -------------------------
#  X/Y Steppers
# -------------------------
[stepper_x]
step_pin: PE1
dir_pin: !PD7
enable_pin: !PD5
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^extruder_mcu:PA10
position_min: -10
position_endstop: -10
position_max: 155
homing_speed: 90
homing_retract_dist: 2

[tmc5160 stepper_x]
cs_pin: PE0
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.5
sense_resistor: 0.05

[stepper_y]
step_pin: PD3
dir_pin: !PD2
enable_pin: !PD0
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^PD1
position_min: -2
position_endstop: 152.5
position_max: 152.5
homing_speed: 90
homing_retract_dist: 2

[tmc5160 stepper_y]
cs_pin: PD4
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.5
sense_resistor: 0.05

# -------------------------
#  Z Stepper
# -------------------------
[stepper_z]
step_pin: PA5
dir_pin: !PA4
enable_pin: !PA7
rotation_distance: 4
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 155
position_min: -5
homing_speed: 2
homing_retract_dist: 3.0
homing_retract_speed: 5.0
second_homing_speed: 5

[tmc2209 stepper_z]
uart_pin: PA6
interpolate: true
run_current: 1.5
sense_resistor: 0.150
uart_address: 3

# -------------------------
#  Extruder
# -------------------------
[thermistor my_thermistor_e]
temperature1: 25
resistance1: 260000
temperature2: 220
resistance2: 738
temperature3: 350
resistance3: 98

[extruder]
step_pin: extruder_mcu:PA8
dir_pin: extruder_mcu:PA9
enable_pin: !extruder_mcu:PA11
rotation_distance: 6.5
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 150
max_extrude_cross_section: 60
heater_pin: extruder_mcu:PB7
sensor_type: my_thermistor_e
pullup_resistor: 11500
sensor_pin: extruder_mcu:PA5
min_temp: 0
max_temp: 385
max_power: 1.0
min_extrude_temp: 150
pressure_advance: 0.025
pressure_advance_smooth_time: 0.025

[tmc2209 extruder]
uart_pin: extruder_mcu:PA12
interpolate: true
run_current: 0.8
sense_resistor: 0.150
uart_address: 3

[verify_heater extruder]      
max_error: 120                
check_gain_time:20           
hysteresis: 5                
heating_gain: 2    

[filament_switch_sensor filament_sensor]
pause_on_runout: False
switch_pin: PB2
runout_gcode:
    M117 Out of Filament
    CONTINUE_PRINT_D D={200}
	
	
# -------------------------
#  Bed Heater
# -------------------------
[thermistor my_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 18085.4
temperature3: 100
resistance3: 5762.6

[heater_bed]
heater_pin: PD12
sensor_type: my_thermistor
sensor_pin: PC5
max_power: 1.0
min_temp: -0
max_temp: 125
control: pid
pid_kp: 53.071
pid_ki: 1.792
pid_kd: 442.428

[verify_heater heater_bed]      
max_error: 120                
check_gain_time:20           
hysteresis: 5                
heating_gain: 2 

# -------------------------
#  Fans
# -------------------------
[fan_generic fan0]
pin: extruder_mcu:PB0
max_power: 1.0
cycle_time: 0.015

[fan_generic fan2] #auxiliary fan
pin: PE11
max_power: 1.0
cycle_time: 0.015

[fan_generic fan3]
pin: PE14
max_power: 1.0
cycle_time: 0.015

# -------------------------
#  Exhaust Fan + Chamber PID
# -------------------------

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 80

[fan_generic exhaust_fan]
pin: PB0
tachometer_pin: PB1
tachometer_ppr: 2
tachometer_poll_interval: 0.0046
cycle_time: 0.01
max_power: 1.0
kick_start_time: 0.80

[gcode_macro CHAMBER_LOOP]
gcode:
    {% set temp = printer["temperature_sensor chamber_temp"].temperature %}
    {% set target = printer.save_variables.variables.ch_target|default(32.0) %}
    {% set kp = printer.save_variables.variables.ch_kp|default(0.15) %}
    {% set ki = printer.save_variables.variables.ch_ki|default(0.020) %}
    {% set minfan = printer.save_variables.variables.ch_minfan|default(0.15) %}
    {% set maxfan = printer.save_variables.variables.ch_maxfan|default(1.00) %}
    {% set i_max = printer.save_variables.variables.ch_i_max|default(0.6) %}
    {% set i_primed = printer.save_variables.variables.ch_i_primed|default(0) %}
    {% set auto_off_delta = 3.0 %}
    {% set i_acc = printer.save_variables.variables.ch_integral|default(0.0) %}

    {% set error = temp - target %}
    {% set i_acc = i_acc + (error * ki) %}

    {% if i_acc > i_max %}
        {% set i_acc = i_max %}
        RESPOND PREFIX="ch" MSG="Accumulator clamped Ki={ki}"
    {% endif %}
    {% if i_acc < (0 - i_max) %}
        {% set i_acc = 0 - i_max %}
        RESPOND PREFIX="ch" MSG="Accumulator clamped Ki={ki}"
    {% endif %}

    {% if i_primed == 0 and ( error < +1.0 and error > -1.0 ) %}
        {% set i_acc = 0 %}
        {% set i_primed = 1 %}
        RESPOND PREFIX="ch" MSG="Target reached"
    {% endif %}
    {% if i_primed == 1 and error <= (0 - auto_off_delta) %}
        CHAMBER_OFF
    {% endif %}
    
    {% set raw = (error * kp) + i_acc %}

    {% if raw < 0 %}
        {% set duty = 0 %}
    {% elif raw > maxfan %}
        {% set duty = maxfan %}
        RESPOND PREFIX="ch" MSG="Fan at maximum S={duty}"
    {% else %}
        {% set duty = raw %}
    {% endif %}

    {% if duty < minfan and duty > 0 %}
        {% set duty = 0 %}
    {% endif %}

    SET_FAN_SPEED FAN=exhaust_fan SPEED={duty}

    SAVE_VARIABLE VARIABLE=ch_last_duty VALUE={duty}
    SAVE_VARIABLE VARIABLE=ch_integral  VALUE={i_acc}
    SAVE_VARIABLE VARIABLE=ch_i_primed  VALUE={i_primed}

    UPDATE_DELAYED_GCODE ID=CHAMBER_TIMER DURATION=60


[gcode_macro CHAMBER_ON]
gcode:
    SAVE_VARIABLE VARIABLE=ch_integral VALUE=0.0
    SAVE_VARIABLE VARIABLE=ch_i_primed VALUE=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_TIMER DURATION=60
    RESPOND PREFIX="ch" MSG="Chamber control on."
    

[gcode_macro CHAMBER_OFF]
gcode:
    UPDATE_DELAYED_GCODE ID=CHAMBER_TIMER DURATION=0
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    SAVE_VARIABLE VARIABLE=ch_integral VALUE=0
    RESPOND PREFIX="ch" MSG="Chamber control off, I reset."
    CH_STATUS_STOP


[gcode_macro CHAMBER_CONFIG]
gcode:
    {% set old_target = printer.save_variables.variables.ch_target|default(32.0) %}
    {% set old_kp     = printer.save_variables.variables.ch_kp|default(0.30) %}
    {% set old_minfan = printer.save_variables.variables.ch_minfan|default(0.40) %}
    {% set old_maxfan = printer.save_variables.variables.ch_maxfan|default(1.00) %}
    {% set old_ki     = printer.save_variables.variables.ch_ki|default(0.00) %}
    {% set old_i_max  = printer.save_variables.variables.ch_i_max|default(0.30) %}

    {% set target = params.TARGET|default(old_target)|float %}
    {% set kp     = params.KP|default(old_kp)|float %}
    {% set minfan = params.MINFAN|default(old_minfan)|float %}
    {% set maxfan = params.MAXFAN|default(old_maxfan)|float %}
    {% set ki     = params.KI|default(old_ki)|float %}
    {% set i_max  = params.I_MAX|default(old_i_max)|float %}

    SAVE_VARIABLE VARIABLE=ch_target  VALUE={target}
    SAVE_VARIABLE VARIABLE=ch_kp      VALUE={kp}
    SAVE_VARIABLE VARIABLE=ch_minfan  VALUE={minfan}
    SAVE_VARIABLE VARIABLE=ch_maxfan  VALUE={maxfan}
    SAVE_VARIABLE VARIABLE=ch_ki      VALUE={ki}
    SAVE_VARIABLE VARIABLE=ch_i_max   VALUE={i_max}

    RESPOND PREFIX="ch" MSG="Config updated: T={target} Kp={kp} Ki={ki} clamp={i_max} min={minfan} max={maxfan}"


[gcode_macro CH_STATUS]
gcode:
    {% set temp_raw = printer["temperature_sensor chamber_temp"].temperature %}
    {% set target_raw = printer.save_variables.variables.ch_target|default(32.0) %}
    {% set kp = printer.save_variables.variables.ch_kp|default(0.15) %}
    {% set error_raw = (temp_raw - target_raw) * kp %}
    {% set i_raw = printer.save_variables.variables.ch_integral|default(0.00) %}

    {% set temp_1 = (temp_raw * 10) // 1 %}
    {% set temp = temp_1 / 10 %}
    {% set target_1 = (target_raw * 10) // 1 %}
    {% set target = target_1 / 10 %}
    {% set error_3 = (error_raw * 1000) // 1 %}
    {% set error = error_3 / 1000 %}
    {% set i_3 = (i_raw * 1000) // 1 %}
    {% set i_val = i_3 / 1000 %}

    {% set duty = printer.save_variables.variables.ch_last_duty|default(0.0) %}
    {% set fan_i = (duty * 100) // 1 %}

    {% set rpm_raw = printer["fan_generic exhaust_fan"].rpm|default(0) %}
    {% set rpm_i = (rpm_raw * 1) // 1 %}
    {% set rpm = rpm_i %}

    RESPOND PREFIX="ch" MSG="T={target} A={temp} P={error} I={i_val} F={fan_i}% R={rpm}"


[delayed_gcode CHAMBER_TIMER]
gcode:
    CHAMBER_LOOP


[gcode_macro CH_STATUS_LOOP]
gcode:
    CH_STATUS
    UPDATE_DELAYED_GCODE ID=CH_STATUS_TIMER DURATION=60


[delayed_gcode CH_STATUS_TIMER]
gcode:
    CH_STATUS_LOOP


[gcode_macro CH_STATUS_STOP]
gcode:
    RESPOND PREFIX="ch" MSG="Live status stopped."
    UPDATE_DELAYED_GCODE ID=CH_STATUS_TIMER DURATION=0


[gcode_macro CH_RESET_I]
gcode:
    SAVE_VARIABLE VARIABLE=ch_integral VALUE=0
    RESPOND PREFIX="ch" MSG="Integral reset."


[gcode_macro M141]
gcode:
    {% set s    = params.S   |default(0)|float %}
    SAVE_VARIABLE VARIABLE=ch_target VALUE={s}

    {% set stir = TRUE %}

    {% if s <= 0 %}
        CHAMBER_OFF
        RESPOND PREFIX="M141:" MSG="target={s}C (off)"
    {% else %}
        {% set bed_target_cur = printer.heater_bed.target|default(0.0) %}

        {% if bed_target_cur <= 0 %}
            {% set bed_temp = ((0.0045*s*s*s) - (0.575*s*s) + (25.2 * s) - 290.0)|int %}
            {% if bed_temp > 124 %}
                {% set bed_temp = 124 %}
            {% endif %}
            M140 S{bed_temp}
            RESPOND PREFIX="M141:" MSG="bed not set, guessing {bed_temp}C"
            {% set bed_report = bed_temp %}
        {% else %}
            {% set bed_1 = bed_target_cur * 1 %}
            {% set bed_report = bed_1 // 1 %}
        {% endif %}

        {% if stir == TRUE %}
            {% if printer["fan_generic fan0"].speed <= 0.0 %}
                SET_FAN_SPEED FAN=fan0 SPEED=1
                RESPOND PREFIX="M141:" MSG="stirring with nozzle cooling fan0 @ 100%"
            {% endif %}
            {% if  printer.extruder.target <= 45 %}
                M104 S46
                RESPOND PREFIX="M141:" MSG="stirring with hotend @ 46C to enable hotend_fan"
            {% endif %}
        {% endif %}

        CHAMBER_ON
        RESPOND PREFIX="M141:" MSG="target={s}C bed={bed_report}C"
    {% endif %}


[gcode_macro M191]
gcode:
    {% set s    = params.S    |default(-9999)|float %}
    {% set r    = params.R    |default(-9999)|float %}
    {% set tol  = params.TOL  |default(printer.save_variables.variables.ch_wtol |default(10))|float %}
    SAVE_VARIABLE VARIABLE=ch_wtol   VALUE={tol}

    {% if r != -9999 %}
        {% set target = r %}
    {% else %}
        {% set target = s %}
    {% endif %}

    M141 S{target}

    {% if target > 0 %}
        {% set t_min = target - tol %}
        {% if r != -9999 %}
            {% set t_max = target + tol %}
            RESPOND PREFIX="M191:" MSG="R: target={target}C tol +/-{tol}C"
            TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={t_min} MAXIMUM={t_max}
        {% else %}
            RESPOND PREFIX="M191:" MSG="S: target={target}C tol -{tol}C"
            TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={t_min}
        {% endif %}
        RESPOND PREFIX="M191:" MSG="Wait complete"
    {% endif %}```

# -------------------------
#  Save Variables
# -------------------------
[save_variables]
filename: ~/variables.cfg

# -------------------------
#  Display
# -------------------------
[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

# -------------------------
#  LEDs
# -------------------------
[neopixel Screen_Colour]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

[output_pin main_led]
pin: PD13
value: 1

[output_pin nozzle_light]
pin: extruder_mcu:PC15
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.01

# -------------------------
#  Idle Timeout
# -------------------------
[idle_timeout]
gcode: _IDLE_TIMEOUT
timeout: 1800

# -------------------------
#  Skew Correction
# -------------------------
[skew_correction]

# -------------------------
#  Virtual SD
# -------------------------
[virtual_sdcard]
path: /home/rex/printer_data/gcodes/

# -------------------------
#  Filament Sensor
# -------------------------
[filament_switch_sensor filament_sensor]
pause_on_runout: False
switch_pin: PB2

