######################################################################
# Sovol Zero  -  mainline Klipper MERGE TEMPLATE
#
# This is NOT a drop-in printer.cfg. You already have a working
# mainline config (steppers, heaters, fans, display, Moonraker, etc.).
# Copy the sections below into YOUR printer.cfg and adjust as noted.
#
# Do not overwrite your SAVE_CONFIG block or machine-specific PID/mesh.
# See docs/INSTALL.md and docs/CALIBRATION.md
######################################################################


# -------------------------------------------------------------------
# Includes  -  add to your existing include list
# -------------------------------------------------------------------
# [include Macro.cfg]           # merge G28 / PRINT_START / END_PRINT from repo
# [include GP3D_Macro.cfg]      # stock display shutdown / heat soak / Z save menus
# [include Rex_Macros.cfg]      # chamber preheat + maintenance macros
# [include camera_macros.cfg]
[include chamber_macros.cfg]   # pause crowsnest during BED_MESH_CALIBRATE (needs gcode_shell_command)
# [include display_macros.cfg]  # UC1701 calibration + tune menus (after GP3D + Rex)
# [include sovol_eddy.cfg]        # eddy probe + bed mesh (required)
# [include probe_pressure.cfg]  # load cell + axis twist (required)
[include line_purge.cfg]        # LINE_PURGE in PRINT_START


# -------------------------------------------------------------------
# MCU CAN UUIDs  -  replace with your boards
# Run on the host: ~/klippy-env/bin/canbus_query.py
# -------------------------------------------------------------------
# [mcu]
# canbus_uuid: <your_main_mcu_uuid>
#
# [mcu extruder_mcu]
# canbus_uuid: <your_toolhead_mcu_uuid>


# -------------------------------------------------------------------
# REMOVE or comment out on Sovol fork / stock configs
# -------------------------------------------------------------------
# [z_offset_calibration]        # replaced by probe_eddy_current + probe_pressure
# [probe_eddy_ng]                 # not used  -  mainline probe_eddy_current path
# [include eddyng.cfg]


# -------------------------------------------------------------------
# [stepper_z]  -  merge into YOUR existing section
# MUST be eddy probe  -  never probe_pressure or a physical Z endstop.
# This is what makes G28 Z non-contact (Cartographer-style).
# -------------------------------------------------------------------
# endstop_pin: probe:z_virtual_endstop
# homing_speed: 2                # typical for eddy tap home
# homing_retract_dist: 3.0
# second_homing_speed: 5


# -------------------------------------------------------------------
# Safe Z home  -  add if missing (coordinates = center of bed / safe_z_home)
# -------------------------------------------------------------------
[safe_z_home]
home_xy_position: 76.2, 76.2    # adjust if your bed origin differs
speed: 90.0
z_hop: 5
z_hop_speed: 10.0


# -------------------------------------------------------------------
# Force move  -  required for EDDY_CALIBRATE_PREP bootstrap
# -------------------------------------------------------------------
[force_move]
enable_force_move: True


# -------------------------------------------------------------------
# Probe sections live in included files (do not duplicate here):
#   sovol_eddy.cfg    → [probe_eddy_current eddy], [bed_mesh], EDDY_CALIBRATE_PREP
#   probe_pressure.cfg → [probe_pressure], [axis_twist_compensation], BED_LOADCELL_Z_OFFSET
# -------------------------------------------------------------------

# Eddy probe, bed mesh, and reg_drive_current / calibrate table are in
# sovol_eddy.cfg. After first cal, Klipper writes them to SAVE_CONFIG below.
# Do NOT copy another machine's SAVE_CONFIG block.


# -------------------------------------------------------------------
# SAVE_CONFIG  -  your printer generates this after calibration.
# Example keys (values are machine-specific  -  do not copy verbatim):
# -------------------------------------------------------------------
#*# [probe_eddy_current eddy]
#*# reg_drive_current = ...
#*# calibrate = ...
#*#
#*# [axis_twist_compensation]
#*# z_compensations = ...
#*# zy_compensations = ...
#*#
#*# [bed_mesh default]
#*# version = 1
#*# points = ...
