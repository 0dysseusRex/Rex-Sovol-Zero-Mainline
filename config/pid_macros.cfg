######################################################################
# PID calibration  -  Mainsail Macros panel
#
# Click a macro, optional TARGET, then SAVE_CONFIG when Klipper PID
# values look good. Chamber exhaust PID is saved via SAVE_VARIABLE
# (CHAMBER_CONFIG), not SAVE_CONFIG.
#
# PID_CHAMBER_HEATER is commented until chamber_hot.cfg is included.
######################################################################

[gcode_macro PID_HOTEND]
description: PID calibrate hotend (default 240C). Run SAVE_CONFIG when done.
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        {action_raise_error("Cannot PID calibrate while printing")}
    {% endif %}
    {% set TARGET = params.TARGET|default(240)|float %}
    RESPOND TYPE=echo MSG="PID calibrating hotend at {TARGET}C"
    PID_CALIBRATE HEATER=extruder TARGET={TARGET}
    RESPOND TYPE=echo MSG="Hotend PID done. Run SAVE_CONFIG to keep the new values."

[gcode_macro PID_BED]
description: PID calibrate bed (default 60C). Run SAVE_CONFIG when done.
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        {action_raise_error("Cannot PID calibrate while printing")}
    {% endif %}
    {% set TARGET = params.TARGET|default(60)|float %}
    RESPOND TYPE=echo MSG="PID calibrating bed at {TARGET}C"
    PID_CALIBRATE HEATER=heater_bed TARGET={TARGET}
    RESPOND TYPE=echo MSG="Bed PID done. Run SAVE_CONFIG to keep the new values."

[gcode_macro PID_CHAMBER]
description: Start chamber exhaust PID at TARGET C (default 40). Tune with CHAMBER_CONFIG.
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        {action_raise_error("Cannot PID calibrate while printing")}
    {% endif %}
    {% set TARGET = params.TARGET|default(40)|float %}
    {% set kp = printer.save_variables.variables.ch_kp|default(0.15) %}
    {% set ki = printer.save_variables.variables.ch_ki|default(0.020) %}
    {% set minfan = printer.save_variables.variables.ch_minfan|default(0.15) %}
    {% set maxfan = printer.save_variables.variables.ch_maxfan|default(1.00) %}
    CHAMBER_CONFIG TARGET={TARGET}
    M141 S{TARGET}
    RESPOND TYPE=echo MSG="Chamber exhaust PID at {TARGET}C  KP={kp} KI={ki} MINFAN={minfan} MAXFAN={maxfan}"
    RESPOND TYPE=echo MSG="Tune with CHAMBER_CONFIG TARGET= KP= KI= MINFAN= MAXFAN=  then M141 S{TARGET|int}"

