# Moonraker webcam — include from moonraker.conf:
#   [include moonraker-webcam.cfg]
#
# Use service: mjpegstreamer (NOT mjpegstreamer-adaptive).
# Adaptive mode often throttles to ~1 fps in Mainsail even when the
# ustreamer backend is delivering 15 fps.

[webcam Camera]
enabled: True
service: mjpegstreamer
stream_url: /webcam/?action=stream
snapshot_url: /webcam/?action=snapshot
target_fps: 15
target_fps_idle: 10
aspect_ratio: 4:3
flip_horizontal: True
flip_vertical: True
rotation: 0
