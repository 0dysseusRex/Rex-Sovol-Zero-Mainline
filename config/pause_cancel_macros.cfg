######################################################################
# Sovol Zero — PAUSE / CANCEL / END_PRINT (single source of truth)
#
# Include AFTER Macro.cfg. Remove (or do not define) PAUSE, CANCEL_PRINT,
# and END_PRINT in Macro.cfg — this file replaces Sovol OEM park macros.
#
# Chain: these macros → PAUSE_BASE / CANCEL_PRINT_BASE (mainsail.cfg)
#        → Klipper pause_resume base.
######################################################################


[gcode_macro _PARK_SAFE]
description: Park XY clamped inside stepper soft limits (0.5 mm margin)
gcode:
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set f = params.F|default(9000)|float %}
    {% set sx = printer.configfile.settings['stepper_x'] %}
    {% set sy = printer.configfile.settings['stepper_y'] %}
    {% set xmin = sx.position_min|float + 0.5 %}
    {% set xmax = sx.position_max|float - 0.5 %}
    {% set ymin = sy.position_min|float + 0.5 %}
    {% set ymax = sy.position_max|float - 0.5 %}
    {% if x < xmin %}
        {% set x = xmin %}
    {% elif x > xmax %}
        {% set x = xmax %}
    {% endif %}
    {% if y < ymin %}
        {% set y = ymin %}
    {% elif y > ymax %}
        {% set y = ymax %}
    {% endif %}
    G90
    G1 X{x} Y{y} F{f}


[gcode_macro _LIFT_Z_SAFE]
description: Relative Z lift clamped to stepper_z position_max
gcode:
    {% set lift = params.LIFT|default(10)|float %}
    {% set f = params.F|default(3000)|float %}
    {% set zmax = printer.configfile.settings['stepper_z'].position_max|float %}
    {% set cur = printer.gcode_move.position.z|float %}
    {% if cur + lift > zmax %}
        {% set lift = zmax - cur %}
    {% endif %}
    {% if lift > 0 %}
        G91
        G1 Z{lift} F{f}
        G90
    {% endif %}


[gcode_macro PAUSE]
description: Pause — mainsail base + safe front-left park
rename_existing: PAUSE_BASE
gcode:
    {% if printer.pause_resume.is_paused == False %}
        {% set e_retract = printer['gcode_macro _global_var'].pause_park.e|default(1)|float %}
        {% set state = params.STATE if params.STATE is defined and 'filament_change' in params.STATE else 'normal' %}

        {action_respond_info("Pause Print!")}
        PAUSE_BASE X=0 Y=0
        M117 Pause Print!!!
        M104 S{printer.extruder.target}

        {% if state == 'normal' %}
            {% if (printer.extruder.temperature + 5 >= printer.extruder.target) and
                  (printer.extruder.temperature >= printer.configfile.settings['extruder'].min_extrude_temp) %}
                {% if printer['filament_switch_sensor filament_sensor'].enabled == True and
                      printer['filament_switch_sensor filament_sensor'].filament_detected == True %}
                    G91
                    G1 E-{e_retract} F300
                    G90
                {% endif %}
            {% endif %}
        {% elif state == 'filament_change' %}
            {% if (printer.extruder.temperature + 5 >= printer.extruder.target) and
                  (printer.extruder.temperature >= printer.configfile.settings['extruder'].min_extrude_temp) %}
                G91
                G1 E-10 F1500
                G1 E-20 F600
                M400
                G4 P3000
                G1 E-50 F300
                G90
            {% endif %}
        {% endif %}
        LIGHT_BREATHE
    {% endif %}


[gcode_macro CANCEL_PRINT]
description: Cancel — mainsail cleanup, safe park, aux fan cooldown
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set e_retract = printer['gcode_macro _global_var'].cancel_park.e|default(1)|float %}
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}

    LIGHT_BLINK
    CANCEL_PRINT_BASE

    {% if printer.toolhead.homed_axes|lower == "xyz" %}
        G91
        {% if printer['filament_switch_sensor filament_sensor'].enabled == True and
              printer['filament_switch_sensor filament_sensor'].filament_detected == True %}
            {% if printer.extruder.temperature >= e_mintemp %}
                G1 E-{e_retract} F500
            {% endif %}
        {% endif %}
        _LIFT_Z_SAFE LIFT=10
        _PARK_SAFE X=0 Y=152
    {% endif %}

    ALL_FAN_OFF
    M117 Cooling Nozzle...
    SET_FAN_SPEED FAN=fan2 SPEED=1.0
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=0 MAXIMUM=50 TIMEOUT=300
    SET_FAN_SPEED FAN=fan2 SPEED=0

    SET_PIN PIN=nozzle_light VALUE=1
    G4 P500
    SET_PIN PIN=nozzle_light VALUE=0

    M220 S100
    M221 S100
    SET_GCODE_VARIABLE MACRO=_global_var VARIABLE=filament_sensor_print VALUE=False
    CLEAR_PAUSE
    M84 X Y Z E
    {action_respond_info("Cancel Print Success!")}


[gcode_macro END_PRINT]
description: Normal print end — safe park and cooldown
variable_state: 'normal'
gcode:
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}

    SET_SKEW CLEAR=1
    M117 Finish Print!!!
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
        G91
        {% if printer['filament_switch_sensor filament_sensor'].enabled == True and
              printer['filament_switch_sensor filament_sensor'].filament_detected == True %}
            {% if printer.extruder.temperature >= e_mintemp %}
                G1 E-2 F2700
                G1 E-2 Z0.2 F2400
            {% endif %}
        {% endif %}
        _LIFT_Z_SAFE LIFT=10
        _PARK_SAFE X=115 Y=152
    {% endif %}

    ALL_FAN_OFF
    TURN_OFF_HEATERS

    M117 Cooling Nozzle...
    SET_FAN_SPEED FAN=fan2 SPEED=1.0
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=0 MAXIMUM=50 TIMEOUT=300
    SET_FAN_SPEED FAN=fan2 SPEED=0

    SET_PIN PIN=nozzle_light VALUE=1
    G4 P500
    SET_PIN PIN=nozzle_light VALUE=0
    G4 P300
    SET_PIN PIN=nozzle_light VALUE=1
    G4 P500
    SET_PIN PIN=nozzle_light VALUE=0

    M220 S100
    M221 S100
    SET_PIN PIN=nozzle_light VALUE=0
    SET_GCODE_VARIABLE MACRO=_global_var VARIABLE=filament_sensor_print VALUE=False
    CLEAR_PAUSE
    M84 X Y Z E
    {action_respond_info("Finish Print!")}
