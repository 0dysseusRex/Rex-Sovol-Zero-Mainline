######################################################################
# Chamber PID + M141/M191 (console output silenced  -  see PRINT_START)
#
# The loop drives [fan_generic exhaust_fan] from [temperature_sensor
# chamber_temp] and keeps its settings in [save_variables]. Stock 1.4.x
# wires both pins inside [temperature_fan exhaust_fan], which SET_FAN_SPEED
# cannot drive; remove that section and define these instead:
#
#   [temperature_sensor chamber_temp]
#   sensor_type: EPCOS 100K B57560G104F
#   sensor_pin: PC4
#   min_temp: 0
#   max_temp: 80
#
#   [fan_generic exhaust_fan]
#   pin: PB0
#   tachometer_pin: PB1
#   tachometer_ppr: 2                 # 1 reads half the real speed
#   tachometer_poll_interval: 0.0019  # 0.0046 aliases at high speed
#   hardware_pwm: false
#   cycle_time: 0.07
#   kick_start_time: 0.40
#   off_below: 0.00
#   shutdown_speed: 0.00
#
# Settings (target, gains, fan limits) are saved by CHAMBER_CONFIG. Loop
# state (integral, priming, last duty) lives in _CH_STATE and is not saved:
# every SAVE_VARIABLE rewrites the whole variables file.
######################################################################

[gcode_macro _CH_SETTINGS]
description: Defaults for chamber settings CHAMBER_CONFIG has not saved
variable_target: 32.0
variable_kp: 0.15
variable_ki: 0.020
variable_minfan: 0.15
variable_maxfan: 1.00
variable_i_max: 0.6
# Stop once the chamber is this far below target with no heat source on.
variable_auto_off: 3.0
gcode:


[gcode_macro _CH_STATE]
description: Chamber loop state, held in RAM and reset by CHAMBER_ON/OFF
variable_running: 0
variable_integral: 0.0
variable_primed: 0
variable_last_duty: 0.0
gcode:


[gcode_macro CHAMBER_LOOP]
gcode:
    {% set d = printer["gcode_macro _CH_SETTINGS"] %}
    {% set sv = printer.save_variables.variables %}
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set temp = printer["temperature_sensor chamber_temp"].temperature %}
    {% set target = sv.ch_target|default(d.target)|float %}
    {% set kp = sv.ch_kp|default(d.kp)|float %}
    {% set ki = sv.ch_ki|default(d.ki)|float %}
    {% set minfan = sv.ch_minfan|default(d.minfan)|float %}
    {% set maxfan = sv.ch_maxfan|default(d.maxfan)|float %}
    {% set i_max = sv.ch_i_max|default(d.i_max)|float %}
    {% set i_primed = st.primed %}
    {% set i_acc = st.integral %}
    # Heat sources: the bed, and chamber_heater when chamber_hot.cfg is loaded.
    {% set heating = printer.heater_bed.target > 0 or
                     ('heater_generic chamber_heater' in printer and
                      printer['heater_generic chamber_heater'].target > 0) %}

    {% set error = temp - target %}
    {% set i_acc = i_acc + (error * ki) %}

    {% if i_acc > i_max %}
        {% set i_acc = i_max %}
    {% endif %}
    {% if i_acc < (0 - i_max) %}
        {% set i_acc = 0 - i_max %}
    {% endif %}

    {% if i_primed == 0 and ( error < +1.0 and error > -1.0 ) %}
        {% set i_acc = 0 %}
        {% set i_primed = 1 %}
    {% endif %}

    {% if error <= (0 - d.auto_off) and not heating %}
        # Nothing heats the chamber and it is below target: the print is over,
        # or control was started cold. CHAMBER_OFF cancels the timer, so
        # nothing below may re-arm it.
        CHAMBER_OFF
    {% else %}
        {% set raw = (error * kp) + i_acc %}

        {% if raw < 0 %}
            {% set duty = 0 %}
        {% elif raw > maxfan %}
            {% set duty = maxfan %}
        {% else %}
            {% set duty = raw %}
        {% endif %}

        {% if duty < minfan and duty > 0 %}
            {% set duty = 0 %}
        {% endif %}

        SET_FAN_SPEED FAN=exhaust_fan SPEED={duty}

        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE={duty}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE={i_acc}
        SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=primed VALUE={i_primed}

        UPDATE_DELAYED_GCODE ID=CHAMBER_TIMER DURATION=60
    {% endif %}


[gcode_macro CHAMBER_ON]
gcode:
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=running VALUE=1
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=primed VALUE=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_TIMER DURATION=60


[gcode_macro _CHAMBER_STOP]
description: Stop the loop and the exhaust, leaving any chamber heater on
gcode:
    UPDATE_DELAYED_GCODE ID=CHAMBER_TIMER DURATION=0
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=running VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=primed VALUE=0
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=last_duty VALUE=0.0


[gcode_macro CHAMBER_OFF]
gcode:
    _CHAMBER_STOP
    {% if 'heater_generic chamber_heater' in printer %}
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% endif %}
    CH_STATUS_STOP


[gcode_macro CHAMBER_CONFIG]
gcode:
    {% set d = printer["gcode_macro _CH_SETTINGS"] %}
    {% set sv = printer.save_variables.variables %}

    {% set target = params.TARGET|default(sv.ch_target|default(d.target))|float %}
    {% set kp     = params.KP|default(sv.ch_kp|default(d.kp))|float %}
    {% set minfan = params.MINFAN|default(sv.ch_minfan|default(d.minfan))|float %}
    {% set maxfan = params.MAXFAN|default(sv.ch_maxfan|default(d.maxfan))|float %}
    {% set ki     = params.KI|default(sv.ch_ki|default(d.ki))|float %}
    {% set i_max  = params.I_MAX|default(sv.ch_i_max|default(d.i_max))|float %}

    SAVE_VARIABLE VARIABLE=ch_target  VALUE={target}
    SAVE_VARIABLE VARIABLE=ch_kp      VALUE={kp}
    SAVE_VARIABLE VARIABLE=ch_minfan  VALUE={minfan}
    SAVE_VARIABLE VARIABLE=ch_maxfan  VALUE={maxfan}
    SAVE_VARIABLE VARIABLE=ch_ki      VALUE={ki}
    SAVE_VARIABLE VARIABLE=ch_i_max   VALUE={i_max}


[gcode_macro CH_STATUS]
description: Chamber PID snapshot (run manually; CH_STATUS_LOOP repeats it)
gcode:
    {% set d = printer["gcode_macro _CH_SETTINGS"] %}
    {% set sv = printer.save_variables.variables %}
    {% set st = printer["gcode_macro _CH_STATE"] %}
    {% set temp = printer["temperature_sensor chamber_temp"].temperature %}
    {% set target = sv.ch_target|default(d.target)|float %}
    {% set p = (temp - target) * sv.ch_kp|default(d.kp)|float %}
    {% set rpm = printer["fan_generic exhaust_fan"].rpm %}
    RESPOND PREFIX="ch" MSG="{'running=%d T=%.1f A=%.1f P=%.3f I=%.3f duty=%.0f%% rpm=%s' % (st.running, target, temp, p, st.integral, st.last_duty * 100, rpm|int if rpm is not none else 'n/a')}"


[delayed_gcode CHAMBER_TIMER]
gcode:
    CHAMBER_LOOP


[gcode_macro CH_STATUS_LOOP]
gcode:
    CH_STATUS
    UPDATE_DELAYED_GCODE ID=CH_STATUS_TIMER DURATION=60


[delayed_gcode CH_STATUS_TIMER]
gcode:
    CH_STATUS_LOOP


[gcode_macro CH_STATUS_STOP]
gcode:
    UPDATE_DELAYED_GCODE ID=CH_STATUS_TIMER DURATION=0


[gcode_macro CH_RESET_I]
gcode:
    SET_GCODE_VARIABLE MACRO=_CH_STATE VARIABLE=integral VALUE=0.0


[gcode_macro M141]
gcode:
    {% set s    = params.S   |default(0)|float %}
    SAVE_VARIABLE VARIABLE=ch_target VALUE={s}

    {% if s <= 0 %}
        CHAMBER_OFF
    {% else %}
        {% if 'heater_generic chamber_heater' in printer %}
            SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={s}
        {% endif %}

        {% set bed_target_cur = printer.heater_bed.target|default(0.0) %}

        {% if bed_target_cur <= 0 %}
            {% set bed_temp = ((0.0045*s*s*s) - (0.575*s*s) + (25.2 * s) - 290.0)|int %}
            {% if bed_temp > 124 %}
                {% set bed_temp = 124 %}
            {% endif %}
            M140 S{bed_temp}
        {% endif %}

        CHAMBER_ON
    {% endif %}


[gcode_macro M191]
gcode:
    {% set s    = params.S    |default(-9999)|float %}
    {% set r    = params.R    |default(-9999)|float %}
    {% set tol  = params.TOL  |default(printer.save_variables.variables.ch_wtol |default(10))|float %}
    SAVE_VARIABLE VARIABLE=ch_wtol   VALUE={tol}

    {% if r != -9999 %}
        {% set target = r %}
    {% else %}
        {% set target = s %}
    {% endif %}

    M141 S{target}

    {% if target > 0 %}
        {% set t_min = target - tol %}
        # Stir while waiting: the part fan, and a hotend above 45 C so the
        # heat-break fan runs. The part fan goes back off after the wait.
        {% set part_off = printer["fan_generic part_cooling_fan"].speed <= 0.0 %}
        {% if part_off %}
            SET_FAN_SPEED FAN=part_cooling_fan SPEED=1
        {% endif %}
        {% if printer.extruder.target <= 45 %}
            M104 S46
        {% endif %}
        {% if r != -9999 %}
            {% set t_max = target + tol %}
            TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={t_min} MAXIMUM={t_max}
        {% else %}
            # CHAMBER_TIMER can't fire during TEMPERATURE_WAIT, which holds the
            # gcode mutex, so the exhaust would keep whatever duty it had for the
            # whole heat-up. Stop it for the wait and restart control after.
            _CHAMBER_STOP
            TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={t_min}
            CHAMBER_ON
        {% endif %}
        {% if part_off %}
            SET_FAN_SPEED FAN=part_cooling_fan SPEED=0
        {% endif %}
    {% endif %}
