# Sovol Zero bed load cell - digital pressure trigger via PD9/PD10
# Phase 1: mainline Klipper v0.13.0 + probe_pressure.py

[gcode_macro GET_PRESSURE_TARE]
description: Tare the bed load cell amplifier board
gcode:
    SET_PIN PIN=sent_tare_signal VALUE=1
    G4 P300
    SET_PIN PIN=sent_tare_signal VALUE=0
    M400

[output_pin sent_tare_signal]
pin: PD9
value: 0

[probe_pressure]
pin: !PD10
x_offset: 0
y_offset: 0
z_offset: 0
speed: 3.0

[gcode_macro PROBE_LOAD_CELL]
description: Tare and query bed load cell pressure probe
gcode:
    M400
    G4 P200
    GET_PRESSURE_TARE
    QUERY_PROBE1
[gcode_macro BED_LOADCELL_Z_OFFSET]
description: Fine Z offset via bed load cell touch at bed center (after eddy G28 Z)
gcode:
    {% set x = params.X|default(76.2)|float %}
    {% set y = params.Y|default(76.2)|float %}
    G90
    {% if 'xy' not in printer.toolhead.homed_axes|lower %}
        G28 X Y
    {% endif %}
    G0 X{x} Y{y} F6000
    G0 Z5 F3000
    G28 Z
    G0 Z5 F3000
    RUN_PROBE_PRESSURE
    SET_GCODE_OFFSET Z={printer.probe_pressure.last_z_result}
    SET_GCODE_VARIABLE MACRO=_global_var VARIABLE=has_z_offset_calibrated VALUE=True
    RESPOND PREFIX="zoffset" MSG="Load cell Z offset applied: {printer.probe_pressure.last_z_result|round(4)} mm"

# Axis twist: eddy probe at toolhead offset + load cell nozzle touch
[axis_twist_compensation]
speed: 50
horizontal_move_z: 5
# X-axis sweep (default AXIS=X)
calibrate_start_x: 20
calibrate_end_x: 132
calibrate_y: 76.2
# Y-axis sweep (AXIS=Y)
calibrate_x: 76.2
calibrate_start_y: 20
calibrate_end_y: 132

[axis_twist_pressure]
