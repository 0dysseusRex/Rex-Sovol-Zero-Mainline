# Sovol Zero bed load cell - digital pressure trigger via PD9/PD10
# Phase 1: mainline Klipper v0.13.0 + probe_pressure.py

[gcode_macro GET_PRESSURE_TARE]
description: Tare the bed load cell amplifier board
gcode:
    SET_PIN PIN=_sent_tare_signal VALUE=1
    G4 P300
    SET_PIN PIN=_sent_tare_signal VALUE=0
    M400

[output_pin _sent_tare_signal]
pin: PD9
value: 0

[probe_pressure]
pin: !PD10
x_offset: 0
y_offset: 0
# Nozzle squish adjustment added to load cell touch height in BED_LOADCELL_Z_OFFSET.
# Negative = nozzle closer; positive = farther. Tune via baby step if needed.
z_offset: 0
speed: 2.0
samples: 6
samples_tolerance: 0.050
samples_tolerance_retries: 2
samples_result: average

[gcode_macro PROBE_LOAD_CELL]
description: Tare and query bed load cell pressure probe
gcode:
    M400
    G4 P200
    GET_PRESSURE_TARE
    QUERY_PROBE1
[gcode_macro BED_LOADCELL_Z_OFFSET]
description: Fine Z0 via load cell nozzle touch  -  PRINT_START and cal only, NOT G28
gcode:
    {% set x = params.X|default(25)|float %}
    {% set y = params.Y|default(20)|float %}
    G90
    {% if 'xy' not in printer.toolhead.homed_axes|lower %}
        G28 X Y
    {% endif %}
    {% if 'z' not in printer.toolhead.homed_axes|lower %}
        G28 Z
    {% endif %}
    G0 X{x} Y{y} F6000
    G0 Z5 F3000
    # Do NOT G28 Z here  -  [safe_z_home] moves to home_xy_position (76.2,76.2) first,
    # which leaves the nozzle away from the load cell at X25 Y20.
    RUN_PROBE_PRESSURE
    {% set touch = printer.probe_pressure.last_z_result|float %}
    {% set z_adj = printer.configfile.settings['probe_pressure'].z_offset|float %}
    {% set total = touch + z_adj %}
    SET_GCODE_OFFSET Z={total}
    RESPOND TYPE=echo MSG="zoffset: SET_GCODE_OFFSET Z={total|round(4)} mm (touch {touch|round(4)} + squish {z_adj})"
    M117 Z offset {total|round(3)}mm

# OEM-style: touch bed near load cell after wipe, hold contact while nozzle cools.
[gcode_macro NOZZLE_BED_COOLDOWN]
description: Touch bed near load cell and hold until nozzle reaches target temp
gcode:
    {% set lc_x = params.X|default(25)|float %}
    {% set lc_y = params.Y|default(20)|float %}
    {% set offset = params.OFFSET|default(3)|float %}
    {% set cool_to = params.TEMP|default(100)|float %}
    {% set touch_x = lc_x + offset %}
    {% set touch_y = lc_y + offset %}
    G90
    G0 Z3 F3000
    G0 X{touch_x} Y{touch_y} F6000
    G0 Z5 F3000
    RUN_PROBE_PRESSURE SAMPLES=1
    SET_FAN_SPEED FAN=part_cooling_fan SPEED=1.0
    M104 S0
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={cool_to}
    SET_FAN_SPEED FAN=part_cooling_fan SPEED=0

# Axis twist: eddy probe at toolhead offset + load cell nozzle touch
#
# The bed load cell sits under ~X25 Y20. Nozzle touches during cal must stay
# near that point or the cell will not trigger cleanly (hard crash at extremes).
# Eddy probe steps still run at the matching probe offsets along each sweep.
# Twist values extrapolate outside this range during mesh/print.
[axis_twist_compensation]
speed: 50
horizontal_move_z: 5
# X-axis sweep (default AXIS=X)  -  nozzle line at Y=20 over load cell
calibrate_start_x: 12
calibrate_end_x: 50
calibrate_y: 20
# Y-axis sweep (AXIS=Y)  -  nozzle line at X=25 over load cell
calibrate_x: 25
calibrate_start_y: 12
calibrate_end_y: 48

[gcode_macro AXIS_TWIST_COMPENSATION_CALIBRATE]
description: Axis twist cal  -  4 evenly-spaced points (eddy + load cell)
rename_existing: AXIS_TWIST_COMPENSATION_CALIBRATE_BASE
gcode:
    {% if params.SAMPLE_COUNT is defined %}
        AXIS_TWIST_COMPENSATION_CALIBRATE_BASE {rawparams}
    {% else %}
        AXIS_TWIST_COMPENSATION_CALIBRATE_BASE SAMPLE_COUNT=4 {rawparams}
    {% endif %}

[axis_twist_pressure]
