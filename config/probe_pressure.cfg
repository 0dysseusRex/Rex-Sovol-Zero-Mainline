# Sovol Zero bed load cell - digital pressure trigger via PD9/PD10
# Phase 1: mainline Klipper v0.13.0 + probe_pressure.py

[gcode_macro GET_PRESSURE_TARE]
description: Tare the bed load cell amplifier board
gcode:
    SET_PIN PIN=sent_tare_signal VALUE=1
    G4 P300
    SET_PIN PIN=sent_tare_signal VALUE=0
    M400

[output_pin sent_tare_signal]
pin: PD9
value: 0

[probe_pressure]
pin: !PD10
x_offset: 0
y_offset: 0
# Nozzle squish adjustment — added to load cell touch height in BED_LOADCELL_Z_OFFSET.
# Tune on a test print with baby steps, then set here (e.g. 0.240 if nozzle was too close).
z_offset: 0
speed: 3.0
samples: 3
samples_tolerance: 0.025
samples_tolerance_retries: 2
samples_result: average

[gcode_macro PROBE_LOAD_CELL]
description: Tare and query bed load cell pressure probe
gcode:
    M400
    G4 P200
    GET_PRESSURE_TARE
    QUERY_PROBE1
[gcode_macro BED_LOADCELL_Z_OFFSET]
description: Fine Z offset via bed load cell touch above sensor (after eddy G28 Z)
gcode:
    {% set x = params.X|default(25)|float %}
    {% set y = params.Y|default(20)|float %}
    G90
    {% if 'xy' not in printer.toolhead.homed_axes|lower %}
        G28 X Y
    {% endif %}
    G0 X{x} Y{y} F6000
    G0 Z5 F3000
    G28 Z
    G0 Z5 F3000
    RUN_PROBE_PRESSURE
    {% set z_adj = printer.configfile.settings['probe_pressure'].z_offset|float %}
    SET_GCODE_OFFSET Z={printer.probe_pressure.last_z_result + z_adj}
    RESPOND PREFIX="zoffset" MSG="Load cell Z offset applied: {(printer.probe_pressure.last_z_result + z_adj)|round(4)} mm (touch {(printer.probe_pressure.last_z_result)|round(4)} + z_offset {z_adj})"

# Axis twist: eddy probe at toolhead offset + load cell nozzle touch
#
# The bed load cell sits under ~X25 Y20. Nozzle touches during cal must stay
# near that point or the cell will not trigger cleanly (hard crash at extremes).
# Eddy probe steps still run at the matching probe offsets along each sweep.
# Twist values extrapolate outside this range during mesh/print.
[axis_twist_compensation]
speed: 50
horizontal_move_z: 5
# X-axis sweep (default AXIS=X) — nozzle line at Y=20 over load cell
calibrate_start_x: 12
calibrate_end_x: 50
calibrate_y: 20
# Y-axis sweep (AXIS=Y) — nozzle line at X=25 over load cell
calibrate_x: 25
calibrate_start_y: 12
calibrate_end_y: 48

[gcode_macro AXIS_TWIST_COMPENSATION_CALIBRATE]
description: Axis twist cal — 4 evenly-spaced points (eddy + load cell)
rename_existing: AXIS_TWIST_COMPENSATION_CALIBRATE_BASE
gcode:
    {% if params.SAMPLE_COUNT is defined %}
        AXIS_TWIST_COMPENSATION_CALIBRATE_BASE {rawparams}
    {% else %}
        AXIS_TWIST_COMPENSATION_CALIBRATE_BASE SAMPLE_COUNT=4 {rawparams}
    {% endif %}

[axis_twist_pressure]
