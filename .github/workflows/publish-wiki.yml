name: Publish Wiki

on:
  push:
    branches: [master]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync docs/wiki to GitHub Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: docs/wiki
          strategy: init
          commit-message: Sync wiki from docs/wiki
          ignore: README.md

      - name: Wiki not initialized hint
        if: failure()
        run: |
          echo "::warning::If this failed with 'Repository not found', create the first wiki page once:"
          echo "https://github.com/${{ github.repository }}/wiki/_new"
          echo "Then re-run this workflow from the Actions tab."
